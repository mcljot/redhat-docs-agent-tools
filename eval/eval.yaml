# Pipeline evaluation configuration for docs-orchestrator
# Uses agent-eval-harness (https://github.com/opendatahub-io/agent-eval-harness)

name: docs-pipeline-eval
description: "Evaluate docs-orchestrator pipeline output against gold standard and baseline documentation"
skill: docs-tools:docs-orchestrator

execution:
  mode: case
  arguments: "{ticket} --docs-repo-path {docs_repo_path}"
  timeout: 3600
  max_budget_usd: 50
  parallelism: 3
  env:
    JIRA_API_TOKEN: $JIRA_API_TOKEN
    JIRA_EMAIL: $JIRA_EMAIL

runner:
  type: claude-code
  # effort: high

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6
  # subagent: claude-opus-4-6

permissions:
  allow:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Skill"
    - "Agent"
    - "AskUserQuestion"
  deny:
    - "mcp__*"

dataset:
  path: eval/dataset/cases
  schema: |
    Each case directory contains input.yaml with fields: ticket (JIRA ID),
    source_repo (url + sha), docs_repo (url + sha + branch for the docs repo
    checked out to the state before the gold standard MR merged), workflow,
    options (format), and ground_truth (tier, source). The reference/
    subdirectory contains the target AsciiDoc files (assemblies and modules)
    to compare against. The docs_repo_path field is resolved at runtime by
    checking out the docs repo at the pinned SHA.

inputs:
  tools:
    - match: "Questions asked to the user via AskUserQuestion."
      prompt: |
        Answer based on the test case context. Pick the first option
        or answer "yes" for confirmations.

outputs:
  - path: .agent_workspace/{ticket}/writing
    schema: |
      AsciiDoc files written into the docs repo at the path specified by
      --docs-repo-path. In update-in-place mode, files are placed according
      to framework detection (Antora nav, assembly includes). The writing
      step's step-result.json sidecar lists all written file paths.

traces:
  stdout: true
  stderr: true
  events: false
  metrics: true

judges:
  # --- Inline checks ---

  - name: files_exist
    type: check
    check: |
      import json
      mods = outputs.get('modified_files', {})
      sr_keys = [k for k in mods if 'writing/step-result.json' in k]
      if not sr_keys:
        return (False, "No writing step-result.json found")
      data = json.loads(mods[sr_keys[0]])
      written = [f for f in data.get('files', []) if f.endswith('.adoc')]
      return (len(written) >= 1, f"Writing step produced {len(written)} AsciiDoc files")

  - name: step_results_valid
    type: check
    check: |
      import json
      mods = outputs.get('modified_files', {})
      steps = ['requirements', 'planning', 'writing']
      missing = []
      for step in steps:
        matches = [k for k in mods if step + '/step-result.json' in k]
        if not matches:
          missing.append(step)
        else:
          data = json.loads(mods[matches[0]])
          if 'schema_version' not in data or 'step' not in data:
            missing.append(f"{step} (invalid)")
      return (len(missing) == 0, f"Missing/invalid: {missing}" if missing else "All step results valid")

  - name: pipeline_complete
    type: check
    check: |
      import json
      mods = outputs.get('modified_files', {})
      progress = [k for k in mods if '/workflow/' in k and k.endswith('.json')]
      if not progress:
        return (False, "No progress file found")
      data = json.loads(mods[progress[0]])
      status = data.get('status', 'unknown')
      return (status == 'completed', f"Pipeline status: {status}")

  # --- LLM judges ---

  - name: doc_quality
    type: prompt
    prompt: |
      You are evaluating AI-generated AsciiDoc documentation for a Red Hat product feature.

      Score the documentation on a 1-5 scale:
      1 - Unusable: major errors, fabricated content, or missing critical sections
      2 - Poor: significant gaps in coverage or accuracy
      3 - Acceptable: covers the basics correctly but lacks depth or polish
      4 - Good: comprehensive, accurate, well-structured, minor issues only
      5 - Excellent: production-ready quality, matches what a senior tech writer would produce

      Consider: technical accuracy, completeness relative to the JIRA ticket scope,
      modular documentation structure (concept/procedure/reference separation),
      and absence of fabricated commands, flags, or API details.

  - name: pairwise
    type: prompt
    prompt_file: eval/config/pairwise-judge.md

thresholds:
  files_exist:
    min_pass_rate: 1.0
  step_results_valid:
    min_pass_rate: 1.0
  pipeline_complete:
    min_pass_rate: 1.0
  doc_quality:
    min_mean: 3.0
  # pairwise: no threshold — informational only
